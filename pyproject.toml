[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmi"
version = "0.1.0"
description = "Deep member insights: dataset building, fine-tuning, evals, and Modal serving for AI Collective member screening"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Studio: counting samples and building datasets
data = [
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "transformers>=5.5.2",  # exact token counts with the target model's chat template
    "jinja2>=3.1",
]
# Studio: launching SageMaker training jobs (SDK v3 ModelTrainer)
launch = [
    "sagemaker>=3.4",
]
# Studio or laptop: running and scoring evals against the endpoint
eval = [
    "openai>=1.40",
    "boto3>=1.34",
]
# Laptop or Studio: deploying the server and loading models into the Modal volume
serve = [
    "modal>=1.6",
]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dmi.screening" = ["resources/*"]
"dmi.train" = ["requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
